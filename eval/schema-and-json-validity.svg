<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390" role="img" aria-labelledby="val-title val-desc">
  <title id="val-title">Schema Validity, JSON Validity, and Stringified-Argument Elimination</title>
  <desc id="val-desc">Field-failure metrics before and after PEFT LoRA / QLoRA tuning: stringified typed arguments drop from 17.5% to 0.0% on Llama 3.2 3B and from 8.3% to 0.0% on Llama 3.2 1B; schema validity rises from 67.5% to 90.8% on 3B and 34.2% to 75.0% on 1B; JSON validity reaches 100.0% across all three tuned models including Muse Glimmer 30B.</desc>
  <rect width="860" height="390" rx="12" fill="#fbfaf7"/>
  <rect x="1" y="1" width="858" height="388" rx="11" fill="none" stroke="#d8d3c8" stroke-width="1.5"/>

  <text x="32" y="40" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#181816">Eliminating Field Tool-Call Failures (Unseen Holdout Splits, n = 150)</text>
  <text x="32" y="64" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#525049">Strict MCP servers reject calls when numbers or objects are quoted as strings (e.g. "fencing_token": "51")</text>

  <!-- Panel A: Stringified Argument Error Rate (Lower is better) -->
  <rect x="32" y="86" width="384" height="256" rx="8" fill="#f3f0e8" stroke="#dfdad0"/>
  <text x="50" y="114" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14.5" font-weight="700" fill="#181816">Stringified Typed Values (Lower = Better)</text>
  <text x="50" y="133" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#5c5952">Share of tool calls quoting numbers or JSON objects</text>

  <text x="50" y="170" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#2c2b28">Llama 3.2 3B Base</text>
  <rect x="195" y="157" width="140" height="16" rx="3" fill="#b5493a"/>
  <text x="343" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#b5493a">17.5%</text>

  <text x="50" y="196" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#1e5a46">Llama 3.2 3B LoRA</text>
  <rect x="195" y="183" width="4" height="16" rx="2" fill="#1e5a46"/>
  <text x="207" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#1e5a46">0.0% (eliminated)</text>

  <text x="50" y="242" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#2c2b28">Llama 3.2 1B Base</text>
  <rect x="195" y="229" width="66.4" height="16" rx="3" fill="#b5493a"/>
  <text x="269" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#b5493a">8.3%</text>

  <text x="50" y="268" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#1e5a46">Llama 3.2 1B LoRA</text>
  <rect x="195" y="255" width="4" height="16" rx="2" fill="#1e5a46"/>
  <text x="207" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#1e5a46">0.0% (eliminated)</text>

  <text x="50" y="316" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#5c5952">63 owned synthetic examples removed stringification on both bases.</text>

  <!-- Panel B: JSON Validity & Refusal Recall (Higher is better) -->
  <rect x="444" y="86" width="384" height="256" rx="8" fill="#f3f0e8" stroke="#dfdad0"/>
  <text x="462" y="114" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14.5" font-weight="700" fill="#181816">JSON Validity &amp; Refusal Recall (Higher = Better)</text>
  <text x="462" y="133" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#5c5952">Valid JSON output and proper refusal of unsupported calls</text>

  <text x="462" y="170" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#2c2b28">1B JSON valid</text>
  <text x="615" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#3b3935">85.3% -&gt; </text>
  <text x="688" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#1e5a46">100.0%</text>

  <text x="462" y="202" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#2c2b28">3B Schema valid</text>
  <text x="615" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#3b3935">67.5% -&gt; </text>
  <text x="688" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#1e5a46">90.8%</text>

  <text x="462" y="234" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#2c2b28">Glimmer 30B JSON</text>
  <text x="615" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#3b3935">96.7% -&gt; </text>
  <text x="688" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#1e5a46">100.0%</text>

  <text x="462" y="266" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#2c2b28">Glimmer Refusal (dev)</text>
  <text x="615" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#3b3935">53.3% -&gt; </text>
  <text x="688" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#1e5a46">100.0%</text>

  <text x="462" y="298" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#2c2b28">Glimmer Refusal (fresh)</text>
  <text x="615" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#3b3935">84.6% -&gt; </text>
  <text x="688" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#1e5a46">100.0%</text>

  <text x="32" y="368" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#5c5952">Sources: tessera/docs/continuous-tuning.md and agora/evidence/glimmer-30b-2026-10-29/fresh-2b-decision.json (sha256: 553354e3...)</text>
</svg>
