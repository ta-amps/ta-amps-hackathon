<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" role="img" aria-label="Measured 2xT4 Data-Scaling Curves Across 64, 256, and 1600 Synthetic OpenCode-Swarm Traces">
  <rect width="920" height="440" fill="#0f172a" rx="12"/>
  <text x="32" y="40" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Llama 3.2 3B Modular Swarm Scaling (64 vs 256 vs 1,600 Synthetic Traces on 2xT4)</text>
  <text x="32" y="64" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Measured completion-only SFT cross-entropy loss and Verifier DPO preference margin (15 PEFT LoRA adapters, $0 spend)</text>

  <!-- Left panel: SFT Final Loss (lower is better) -->
  <rect x="32" y="86" width="420" height="312" fill="#1e293b" rx="8" stroke="#334155"/>
  <text x="52" y="114" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Specialist vs Monolithic SFT Loss (Lower = Better)</text>
  <line x1="88" y1="340" x2="424" y2="340" stroke="#475569" stroke-width="1.5"/>
  <line x1="88" y1="140" x2="88" y2="340" stroke="#475569" stroke-width="1.5"/>
  <text x="78" y="344" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="end">0.0</text>
  <text x="78" y="264" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="end">0.5</text>
  <text x="78" y="184" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="end">1.0</text>
  <line x1="88" y1="260" x2="424" y2="260" stroke="#334155" stroke-dasharray="4,4"/>
  <line x1="88" y1="180" x2="424" y2="180" stroke="#334155" stroke-dasharray="4,4"/>

  <text x="130" y="362" fill="#cbd5e1" font-family="monospace" font-size="12" text-anchor="middle">64 traces</text>
  <text x="256" y="362" fill="#cbd5e1" font-family="monospace" font-size="12" text-anchor="middle">256 traces</text>
  <text x="382" y="362" fill="#cbd5e1" font-family="monospace" font-size="12" text-anchor="middle">1,600 traces</text>

  <!-- Monolithic: 1.0088 -> 0.5407 -> 0.4256 (y = 340 - loss*160) -->
  <polyline fill="none" stroke="#f97316" stroke-width="3" points="130,178.6 256,253.5 382,271.9"/>
  <circle cx="130" cy="178.6" r="5" fill="#f97316"/><circle cx="256" cy="253.5" r="5" fill="#f97316"/><circle cx="382" cy="271.9" r="5" fill="#f97316"/>
  <!-- Shim Retriever: 0.7687 -> 0.4398 -> 0.3549 -->
  <polyline fill="none" stroke="#38bdf8" stroke-width="3" points="130,217.0 256,269.6 382,283.2"/>
  <circle cx="130" cy="217.0" r="5" fill="#38bdf8"/><circle cx="256" cy="269.6" r="5" fill="#38bdf8"/><circle cx="382" cy="283.2" r="5" fill="#38bdf8"/>
  <!-- Task Decomposer: 0.4313 -> 0.3507 -> 0.3600 -->
  <polyline fill="none" stroke="#34d399" stroke-width="3" points="130,271.0 256,283.9 382,282.4"/>
  <circle cx="130" cy="271.0" r="5" fill="#34d399"/><circle cx="256" cy="283.9" r="5" fill="#34d399"/><circle cx="382" cy="282.4" r="5" fill="#34d399"/>

  <text x="52" y="384" fill="#f97316" font-family="system-ui, sans-serif" font-size="11">Monolithic: 1.01-&gt;0.43</text>
  <text x="192" y="384" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Retriever: 0.77-&gt;0.35</text>
  <text x="322" y="384" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">Decomposer: 0.43-&gt;0.36</text>

  <!-- Right panel: Verifier DPO Preference Margin (higher is better) -->
  <rect x="468" y="86" width="420" height="312" fill="#1e293b" rx="8" stroke="#334155"/>
  <text x="488" y="114" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Verifier DPO Preference Margin (Chosen vs Tombstone)</text>
  <line x1="524" y1="340" x2="860" y2="340" stroke="#475569" stroke-width="1.5"/>
  <!-- Bars: 64=13.64, 256=20.12, 1600=24.54 (scale max 28 -> 180px) -->
  <rect x="556" y="252.3" width="64" height="87.7" fill="#818cf8" rx="4"/>
  <text x="588" y="244" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">+13.64</text>
  <text x="588" y="362" fill="#cbd5e1" font-family="monospace" font-size="12" text-anchor="middle">64 pairs</text>

  <rect x="664" y="210.7" width="64" height="129.3" fill="#6366f1" rx="4"/>
  <text x="696" y="202" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">+20.12</text>
  <text x="696" y="362" fill="#cbd5e1" font-family="monospace" font-size="12" text-anchor="middle">256 pairs</text>

  <rect x="772" y="182.2" width="64" height="157.8" fill="#4f46e5" rx="4"/>
  <text x="804" y="174" fill="#a5b4fc" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">+24.54</text>
  <text x="804" y="362" fill="#cbd5e1" font-family="monospace" font-size="12" text-anchor="middle">1,600 pairs</text>

  <text x="488" y="384" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">DPO loss: 0.0832 (64) -&gt; 0.0702 (256) -&gt; 0.0654 (1,600) | 100% batch win rate</text>
</svg>
