  <text x="752" y="544" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="700" fill="#161614">Second-worker check</text>
  <text x="752" y="592" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="23" fill="#3D3C37">Separate key reviews every draft;</text>
  <text x="752" y="626" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="23" fill="#3D3C37">hourly policy picks Muse models</text>

