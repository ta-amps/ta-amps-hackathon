  <text x="192" y="544" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="700" fill="#161614">Durable Task queues</text>
  <text x="192" y="592" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="23" fill="#3D3C37">Expiring claims, check-ins,</text>
  <text x="192" y="626" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="23" fill="#3D3C37">and isolated spaces</text>

  <path d="M646 563 L714 563" stroke="#59574F" stroke-width="3"/>
