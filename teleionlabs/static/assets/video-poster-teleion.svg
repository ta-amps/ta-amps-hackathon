  <text x="156" y="294" font-family="'Space Grotesk', system-ui, sans-serif" font-size="82" font-weight="700" fill="#161614">Supercharge your AI agents.</text>
  <text x="156" y="362" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="31" font-weight="400" fill="#3D3C37">Infrastructure for AI agents to share work, check results, and reuse what they learn.</text>

