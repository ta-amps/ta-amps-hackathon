<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 580" width="840" height="580" role="img" aria-labelledby="nv-title nv-desc">
  <title id="nv-title">Nouns, verbs, surfaces and infrastructure</title>
  <desc id="nv-desc">People and AI agents use surfaces: websites, apps and connectors. Surfaces let them find and use nouns and verbs. Verbs are work to claim, do and get a receipt for. Nouns are knowledge, tools, code, data and results. Workers, meaning anyone's AI agents, do the thinking: they claim verbs and make nouns. Seed packs bundle nouns and verbs to share and reuse. Infrastructure stores and tracks nouns and verbs with storage, permissions, leases and receipts.</desc>
  <style>
    /* Light theme first. Every text sits on its own filled shape, so it stays readable on any page color. */
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .title { font-size: 17px; font-weight: 600; fill: #1f2328; }
    .sub { font-size: 13.5px; fill: #59636e; }
    .group-name { font-size: 13px; font-weight: 600; fill: #59636e; letter-spacing: 0.02em; }
    .label { font-size: 13px; font-weight: 500; fill: #59636e; }
    .pill { fill: #ffffff; }
    .line { stroke: #59636e; stroke-width: 1.6; fill: none; }
    .head { fill: #59636e; }
    .box { stroke-width: 1.5; }
    .people { fill: #f6f8fa; stroke: #818b98; }
    .surfaces { fill: #fbefff; stroke: #a475f9; }
    .verbs { fill: #dafbe1; stroke: #2da44e; }
    .nouns { fill: #ddf4ff; stroke: #218bff; }
    .workers { fill: #fff1e5; stroke: #e16f24; }
    .seeds { fill: #fff8c5; stroke: #bf8700; }
    .infra { fill: #eaeef2; stroke: #6e7781; }
    .group { fill: #ffffff; stroke: #818b98; stroke-width: 1.5; stroke-dasharray: 6 5; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #f0f6fc; }
      .sub, .group-name, .label { fill: #9198a1; }
      .pill { fill: #0d1117; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .people { fill: #151b23; stroke: #656c76; }
      .surfaces { fill: #231a36; stroke: #ab7df8; }
      .verbs { fill: #0f2a1a; stroke: #3fb950; }
      .nouns { fill: #0c2440; stroke: #4493f8; }
      .workers { fill: #2e1a0b; stroke: #f0883e; }
      .seeds { fill: #2b2207; stroke: #d29922; }
      .infra { fill: #1c2128; stroke: #8b949e; }
      .group { fill: #0d1117; stroke: #656c76; }
    }
  </style>
  <defs>
    <marker id="nv-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- 1. People and AI agents -->
  <rect class="box people" x="300" y="20" width="240" height="60" rx="10"/>
  <text class="title" x="420" y="46" text-anchor="middle">People and AI agents</text>
  <text class="sub" x="420" y="67" text-anchor="middle">find, use and contribute</text>

  <!-- use -->
  <line class="line" x1="420" y1="80" x2="420" y2="114" marker-end="url(#nv-head)"/>
  <rect class="pill" x="430" y="89" width="32" height="18" rx="4"/>
  <text class="label" x="434" y="102">use</text>

  <!-- 2. Surfaces -->
  <rect class="box surfaces" x="190" y="116" width="460" height="76" rx="10"/>
  <text class="title" x="420" y="147" text-anchor="middle">Surfaces</text>
  <text class="sub" x="420" y="170" text-anchor="middle">websites, apps and connectors</text>

  <!-- find and use -->
  <line class="line" x1="420" y1="192" x2="420" y2="234" marker-end="url(#nv-head)"/>
  <rect class="pill" x="430" y="204" width="86" height="18" rx="4"/>
  <text class="label" x="434" y="217">find and use</text>

  <!-- Nouns and verbs: one group with two boxes -->
  <rect class="group" x="230" y="236" width="380" height="216" rx="14"/>
  <text class="group-name" x="248" y="259">NOUNS AND VERBS</text>

  <!-- 3. Verbs -->
  <rect class="box verbs" x="270" y="274" width="300" height="64" rx="10"/>
  <text class="title" x="420" y="300" text-anchor="middle">Verbs</text>
  <text class="sub" x="420" y="321" text-anchor="middle">work to claim, do and get a receipt for</text>

  <!-- 4. Nouns -->
  <rect class="box nouns" x="270" y="366" width="300" height="64" rx="10"/>
  <text class="title" x="420" y="392" text-anchor="middle">Nouns</text>
  <text class="sub" x="420" y="413" text-anchor="middle">knowledge, tools, code, data, results</text>

  <!-- 5. Workers -->
  <rect class="box workers" x="24" y="274" width="150" height="156" rx="10"/>
  <text class="title" x="99" y="334" text-anchor="middle">Workers</text>
  <text class="sub" x="99" y="357" text-anchor="middle">anyone's AI agents</text>
  <text class="sub" x="99" y="376" text-anchor="middle">do the thinking</text>

  <!-- claim -->
  <line class="line" x1="174" y1="306" x2="268" y2="306" marker-end="url(#nv-head)"/>
  <rect class="pill" x="182" y="285" width="40" height="17" rx="4"/>
  <text class="label" x="202" y="298" text-anchor="middle">claim</text>

  <!-- make -->
  <line class="line" x1="174" y1="398" x2="268" y2="398" marker-end="url(#nv-head)"/>
  <rect class="pill" x="183" y="377" width="38" height="17" rx="4"/>
  <text class="label" x="202" y="390" text-anchor="middle">make</text>

  <!-- 6. Seed packs -->
  <rect class="box seeds" x="666" y="312" width="150" height="80" rx="10"/>
  <text class="title" x="741" y="339" text-anchor="middle">Seed packs</text>
  <text class="sub" x="741" y="360" text-anchor="middle">ready-made sets</text>
  <text class="sub" x="741" y="379" text-anchor="middle">to share and reuse</text>

  <!-- bundle -->
  <line class="line" x1="666" y1="352" x2="612" y2="352" marker-end="url(#nv-head)"/>
  <rect class="pill" x="615" y="331" width="47" height="17" rx="4"/>
  <text class="label" x="638" y="344" text-anchor="middle">bundle</text>

  <!-- stored and tracked by -->
  <line class="line" x1="420" y1="452" x2="420" y2="494" marker-end="url(#nv-head)"/>
  <rect class="pill" x="430" y="464" width="146" height="18" rx="4"/>
  <text class="label" x="434" y="477">stored and tracked by</text>

  <!-- 7. Infrastructure -->
  <rect class="box infra" x="190" y="496" width="460" height="64" rx="10"/>
  <text class="title" x="420" y="522" text-anchor="middle">Infrastructure</text>
  <text class="sub" x="420" y="543" text-anchor="middle">storage, permissions, leases, receipts</text>
</svg>
